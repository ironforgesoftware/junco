name: Publish to npm

# Publishes the package whenever a GitHub Release is published.
#
# Release flow (see CLAUDE.md "Git & release" — Release HOLD applies):
#   1. Bump "version" in package.json (+ update CHANGELOG.md) via a PR to main.
#   2. After merge + quality gate green: git tag -a vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z
#   3. Create a GitHub Release for that tag (gh release create vX.Y.Z ...).
#
# Auth is npm "trusted publishing" (GitHub OIDC) — no NPM_TOKEN secret. The
# package's Trusted Publisher on npmjs.com must point at this repo + this
# workflow filename (publish.yml). Deliberately NOT set here:
#   - setup-node's registry-url: it writes an .npmrc _authToken placeholder,
#     and any token (even a placeholder) makes npm skip OIDC.
#   - setup-node's cache: restoring a cache into a publishing job is a
#     cache-poisoning vector; a cold npm ci costs seconds.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # publish needs no git credentials; don't leave a token in .git/config
          fetch-depth: 0 # full history — the ancestry guard below needs merge-base
      # Refuse to publish a tag whose commit is not on main: only commits that
      # went through the multi-OS quality gate (required to merge) may ship.
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit $GITHUB_SHA is not an ancestor of origin/main — tags must point at commits on main"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # belt for the "no cache in a publishing job" rule above: setup-node
          # auto-caches if package.json ever grows a packageManager field
          package-manager-cache: false
      # Publish with node's BUNDLED npm — no `npm install -g npm@X` here.
      # Trusted publishing needs npm >= 11.5.1 (node 24.18 bundles 11.16.0,
      # and the setup-node major is pinned above); v0.4.0 shipped exactly this
      # way. Overlay-installing a different npm over the toolcache broke two
      # v0.5.0 release runs in two different ways:
      #   - npm@12.0.0 ships without the unscoped `sigstore` package its own
      #     libnpmpublish/lib/provenance.js requires → MODULE_NOT_FOUND.
      #   - npm@11.18.0 (delta-overlaid onto bundled 11.16.0) never attempted
      #     the OIDC exchange → ENEEDAUTH, deterministic across a rerun.
      # If a future npm floor forces an upgrade, verify a provenance publish
      # end-to-end before pinning it.
      - name: Record the publishing npm version
        run: npm --version
      - name: Verify release tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # `npm publish` runs the prepublishOnly hook (npm run build && npm test)
      # before publishing. NO explicit --provenance: with trusted publishing
      # the registry attaches provenance automatically, and the explicit flag
      # front-loads an auth check that fires before the OIDC exchange —
      # observed as ENEEDAUTH on every v0.5.0 attempt (npm 11.16/11.18).
      # --loglevel http keeps the OIDC exchange visible in the run log so the
      # next auth failure is diagnosable without another release cycle.
      - run: npm publish --access public --loglevel http
