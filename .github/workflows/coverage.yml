name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Same grouping rationale as quality-gate.yml: PRs per ref (a force-push
# cancels the superseded run), pushes per SHA (so rapid merges don't leave a
# commit with a cancelled run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE leg only, deliberately. The quality gate's ubuntu x macos matrix would
  # produce two different coverage numbers, because sandbox.integration.test.ts
  # is platform-gated and skips when the Seatbelt/bwrap binary is absent. The
  # floor lives in vitest.config.ts's coverage.thresholds; this job enforces it.
  #
  # Consequence, stated so it is not a surprise: this leg does NOT install
  # bubblewrap (the gate's ubuntu leg does, #277), so sandbox.integration.test.ts
  # skips here and the pinned floor — the global numbers and the
  # src/agent/sandbox/** glob alike — is a unit-suite-only measurement. That is
  # the price of one runner-independent number; real bwrap/Seatbelt enforcement
  # is gated by quality-gate.yml. Measured 2026-09-01, excluding that suite moves
  # no reported percentage, so it is not inflating the floor either.
  #
  # Kept as its own workflow rather than folded into the gate's ubuntu leg
  # (#388). GitHub badges are per-workflow, not per-job, so folding would also
  # delete the README coverage badge, and the separately named `coverage` check
  # is worth the duplicate ~40s. It is not a required check — the ruleset
  # requires only the aggregate `quality-gate` context — so it can never block a
  # merge on its own.
  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; don't leave a token in .git/config
      # repo/pr/worktree tests create real commits in temp repos
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "junco-ci"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage
