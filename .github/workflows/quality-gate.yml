name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PRs group per ref so a force-push cancels the superseded run. Pushes group
# per SHA: a concurrency group also cancels PENDING runs when a newer one
# queues, so grouping main by ref would let rapid merges leave commits with a
# cancelled gate — per-SHA keeps main's result history unbroken.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per OS = one check-run entry per OS (GitHub reports every job as
  # its own check; this is the fewest entries that still covers both OSes in
  # parallel). Each job runs the full gate on the engines floor — including
  # the packaged-CLI smoke test — then re-installs, rebuilds, and re-tests on
  # current LTS. The static checks (lint/format/typecheck) run once per OS;
  # they are node-version-independent.
  env_gate:
    name: quality gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; don't leave a token in .git/config
      # repo/pr/worktree tests create real commits in temp repos
      - run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "junco-ci"
      # bubblewrap is the Linux sandbox backend. Without it, every case in
      # tests/sandbox.integration.test.ts skips and this leg reports green
      # while exercising no real bwrap enforcement (#277). macOS needs no
      # install — sandbox-exec ships with the OS.
      - name: bubblewrap (linux sandbox backend for the integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: node 22.19.0 (engines floor, exact)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # the shipped tarball must install and run on the minimum supported node
      - run: bash scripts/package-smoke.sh

      - name: node 24 (current LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The single status check that ties every environment leg together. Branch
  # protection requires exactly this context: "quality-gate".
  gate:
    name: quality-gate
    needs: [env_gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every environment gate succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::An environment quality gate did not succeed — env_gate=${{ needs.env_gate.result }}"
          exit 1
      - name: All environments green
        run: echo "quality gate passed — env_gate=${{ needs.env_gate.result }}"
